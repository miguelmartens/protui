# Hooks shell out to the Makefile rather than reimplementing the checks, so a
# commit is verified with the same commands as `make check` and CI. A check
# added in one place is added in all three.
#
# Install with `make hooks`. Bypass a run with `git commit --no-verify`.
#
# Every hook is repo-wide (`pass_filenames: false`): `go vet` and `go test`
# are package-scoped, and prettier is pointed at the whole tree by
# `.prettierignore`. The `files` patterns therefore decide only *whether* a
# hook runs, not what it looks at.

repos:
  - repo: local
    hooks:
      # Ordered fastest first, so an obvious failure does not wait behind the
      # test suite.
      - id: gofmt
        name: gofmt
        entry: make fmt-check
        language: system
        files: '\.go$|^go\.(mod|sum)$'
        pass_filenames: false

      # prettier reads its own config, so a change to that config is a reason
      # to re-check the tree.
      - id: prettier
        name: prettier
        entry: make format-check
        language: system
        files: '\.(md|json|ya?ml)$|^\.prettier(rc|ignore)$'
        pass_filenames: false

      - id: go-vet
        name: go vet
        entry: make vet
        language: system
        files: '\.go$|^go\.(mod|sum)$'
        pass_filenames: false

      # Skipped with a note when golangci-lint is absent, matching the Makefile
      # target. CI runs it either way.
      - id: golangci-lint
        name: golangci-lint
        entry: make lint-go
        language: system
        files: '\.go$|^go\.(mod|sum)$|^\.golangci\.yml$'
        pass_filenames: false

      # Without -race: that pass belongs to CI, which can afford the wall time.
      - id: go-test
        name: go test
        entry: make test
        language: system
        files: '\.go$|^go\.(mod|sum)$'
        pass_filenames: false
